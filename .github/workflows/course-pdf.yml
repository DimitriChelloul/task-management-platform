name: Build Course PDF

on:
  push:
    paths:
      - 'docs/**'
      - '.github/**'
  workflow_dispatch: {}

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (required for some markdown assets)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pandoc and Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wget ca-certificates
          # Install Chrome
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Concatenate course-pack markdown into single handbook
        run: |
          # Order matters: README, syllabus, setup, architecture, lab, solutions, security, ci
          mkdir -p docs
          cat \
            docs/course-pack/README.md \
            docs/course-pack/syllabus.md \
            docs/course-pack/lecture_setup.md \
            docs/course-pack/lecture_architecture.md \
            docs/course-pack/lab1_create_api.md \
            docs/course-pack/solutions/lab1_solution.md \
            docs/course-pack/security.md \
            docs/course-pack/ci_cd.md \
            > docs/course-handbook.md

      - name: Generate HTML from concatenated Markdown
        run: |
          pandoc docs/course-handbook.md -s -o docs/course-handbook.html

      - name: Generate PDF with headless Chrome
        run: |
          ABS=$(realpath docs/course-handbook.html)
          google-chrome --headless --disable-gpu --print-to-pdf=docs/course-handbook.pdf "file:///$ABS"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-handbook-pdf
          path: docs/course-handbook.pdf
