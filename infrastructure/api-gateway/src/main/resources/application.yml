server:
  port: 8082

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/auth/**
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
        - id: task-service
          uri: lb://TASK-SERVICE
          predicates:
            - Path=/tasks/**

jwt:
  secret: "0123456789abcdef0123456789abcdef"
  issuer: "task-management"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

