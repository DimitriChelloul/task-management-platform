server:
  port: 8083

spring:
  application:
    name: task-service
  
  # Database configuration (pour Lab 3)
  datasource:
    url: jdbc:postgresql://localhost:5432/task_db
    username: task_user
    password: task_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway gère les migrations
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
  
  # Kafka configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: task-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# Kafka topics configuration
kafka:
  topics:
    taskCreated: task.created
    taskCompleted: task.completed
    userCreated: user.created  # Listening for user events

# JWT configuration (shared with user-service)
jwt:
  secret: "0123456789abcdef0123456789abcdef"
  issuer: "task-management"
  expiration-minutes: 120

# Service discovery (Eureka)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: task-service:${random.value}

# Logging
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.dimitri.task: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Management endpoints (pour monitoring, optionnel)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
