services:
  postgres:
    image: postgres:16
    container_name: tmp-postgres
    environment:
      POSTGRES_USER: tmp
      POSTGRES_PASSWORD: tmp
      POSTGRES_DB: tmp
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d
      - tmp_pgdata:/var/lib/postgresql/data

volumes:
  tmp_pgdata:
